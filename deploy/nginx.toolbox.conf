# /etc/nginx/sites-available/toolbox.denisetiawan.me  (then symlink into sites-enabled)
# Serves the static export at $DEPLOY_PATH/current (a symlink the deploy workflow switches).
server {
    listen 80;
    listen [::]:80;
    server_name toolbox.denisetiawan.me;

    # Change to your DEPLOY_PATH. After `certbot --nginx -d toolbox.denisetiawan.me`,
    # certbot adds the HTTPS server block and the redirect for you.
    root /var/www/toolbox/current;
    index index.html;

    # /compress-image -> compress-image.html, /en -> en.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Hashed build assets never change: cache them for a year.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML must revalidate so a new deploy shows up immediately.
    location ~* \.(html|txt|xml)$ {
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}
